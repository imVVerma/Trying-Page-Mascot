<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="innerEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow Border -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ears -->
  <!-- Left Ear -->
  <polygon points="17,32 12,12 28,21" fill="url(#furGrad)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="18,29 15,16 25,23" fill="url(#innerEar)" />
  <!-- Right Ear -->
  <polygon points="47,32 52,12 36,21" fill="url(#furGrad)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="46,29 49,16 39,23" fill="url(#innerEar)" />

  <!-- Head Base -->
  <ellipse cx="32" cy="38" rx="19" ry="16" fill="url(#furGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- White Muzzle & Cheeks -->
  <path d="M 18,36 Q 32,48 46,36 Q 44,48 32,50 Q 20,48 18,36 Z" fill="#fff7ed" />

  <!-- Big Expressive Cursor-Tracking Eyes -->
  <!-- Left Eye -->
  <ellipse cx="25" cy="33" rx="4.5" ry="6" fill="#0f172a" />
  <circle cx="26.5" cy="31" r="2" fill="#ffffff" />
  <circle cx="24" cy="35" r="0.8" fill="#ffffff" />
  <!-- Right Eye -->
  <ellipse cx="39" cy="33" rx="4.5" ry="6" fill="#0f172a" />
  <circle cx="40.5" cy="31" r="2" fill="#ffffff" />
  <circle cx="38" cy="35" r="0.8" fill="#ffffff" />

  <!-- Cute Nose & Smile -->
  <ellipse cx="32" cy="40.5" rx="2" ry="1.4" fill="#0f172a" />
  <path d="M 29.5,43 Q 32,45.5 34.5,43" fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" />

  <!-- Soft Pink Cheeks -->
  <ellipse cx="20" cy="39" rx="2.5" ry="1.5" fill="#f43f5e" opacity="0.45" />
  <ellipse cx="44" cy="39" rx="2.5" ry="1.5" fill="#f43f5e" opacity="0.45" />

  <!-- Sparkle Badge in Top-Right -->
  <path d="M 48,14 Q 50,18 54,18 Q 50,18 48,22 Q 46,18 42,18 Q 46,18 48,14 Z" fill="#38bdf8" filter="url(#glow)" />
</svg>